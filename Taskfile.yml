version: '3'

tasks:

  init:
    desc: Copy .env.*.example files to deployment env files (skips existing)
    cmds:
      - task: _copy-env
        vars: { SRC: .env.example, DST: .env }
      - task: _copy-env
        vars: { SRC: .env.db.example, DST: .env.db }
      - task: _copy-env
        vars: { SRC: .env.api.example, DST: .env.api }
      - task: _copy-env
        vars: { SRC: .env.deriver.example, DST: .env.deriver }

  _copy-env:
    internal: true
    cmds:
      - cmd: 'powershell -Command "if (-not (Test-Path \"{{.DST}}\")) { Copy-Item \"{{.SRC}}\" \"{{.DST}}\"; Write-Host \"created {{.DST}}\" } else { Write-Host \"skip   {{.DST}}\" }"'
        platforms: [windows]
      - cmd: '[ -f "{{.DST}}" ] && echo "skip   {{.DST}}" || (cp "{{.SRC}}" "{{.DST}}" && echo "created {{.DST}}")'
        platforms: [linux, darwin]

  up:
    desc: Start all containers (detached)
    cmds:
      - docker compose up -d

  down:
    desc: Stop all containers
    cmds:
      - docker compose down

  restart:
    desc: Restart all containers
    cmds:
      - docker compose restart

  logs:
    desc: Stream logs from all services
    cmds:
      - docker compose logs -f

  ps:
    desc: Show container status
    cmds:
      - docker compose ps

  health:
    desc: Check the API health endpoint
    cmds:
      - cmd: curl -s http://localhost:$(grep ^HONCHO_PORT .env | cut -d= -f2)/health | jq .
        platforms: [linux, darwin]
      - cmd: 'powershell -Command "$port = (Get-Content .env | Select-String \"^HONCHO_PORT\").Line.Split(\"=\")[1]; curl -s \"http://localhost:$port/health\" | jq ."'
        platforms: [windows]

  shell-db:
    desc: Open a psql shell inside the database container
    cmds:
      - cmd: docker exec -it honcho-db psql -U $(grep ^POSTGRES_USER .env.db | cut -d= -f2) -d $(grep ^POSTGRES_DB .env.db | cut -d= -f2)
        platforms: [linux, darwin]
      - cmd: 'powershell -Command "$u = (Get-Content .env.db | Select-String \"^POSTGRES_USER\").Line.Split(\"=\")[1]; $d = (Get-Content .env.db | Select-String \"^POSTGRES_DB\").Line.Split(\"=\")[1]; docker exec -it honcho-db psql -U $u -d $d"'
        platforms: [windows]

  reset:
    desc: "Destroy containers, volumes, and db_data/ — destructive!"
    prompt: This will destroy all data. Are you sure?
    cmds:
      - docker compose down -v
      - cmd: rm -rf ./db_data
        platforms: [linux, darwin]
      - cmd: powershell -Command "Remove-Item -Recurse -Force ./db_data -ErrorAction SilentlyContinue"
        platforms: [windows]
