version: '3'

dotenv:
  - .env
  - .env.db

tasks:

  init:
    desc: Copy .env.*.example files to deployment env files (skips existing)
    cmds:
      - task: _copy-env
        vars: { SRC: .env.example, DST: .env }
      - task: _copy-env
        vars: { SRC: .env.db.example, DST: .env.db }
      - task: _copy-env
        vars: { SRC: .env.api.example, DST: .env.api }
      - task: _copy-env
        vars: { SRC: .env.deriver.example, DST: .env.deriver }

  _copy-env:
    internal: true
    cmds:
      - cmd: 'powershell -Command "if (-not (Test-Path ''{{.DST}}'')) { Copy-Item ''{{.SRC}}'' ''{{.DST}}''; Write-Host ''created {{.DST}}'' } else { Write-Host ''skip   {{.DST}}'' }"'
        platforms: [windows]
      - cmd: '[ -f "{{.DST}}" ] && echo "skip   {{.DST}}" || (cp "{{.SRC}}" "{{.DST}}" && echo "created {{.DST}}")'
        platforms: [linux, darwin]

  build:
    desc: Build the honcho image from source (pulls directly from GitHub)
    cmds:
      - docker build https://github.com/plastic-labs/honcho.git -t honcho:local

  up:
    desc: Start all containers (detached)
    cmds:
      - docker compose up -d

  down:
    desc: Stop all containers
    cmds:
      - docker compose down

  restart:
    desc: Restart all containers
    cmds:
      - docker compose restart

  logs:
    desc: Stream logs from all services
    cmds:
      - docker compose logs -f

  ps:
    desc: Show container status
    cmds:
      - docker compose ps

  health:
    desc: Check the API health endpoint
    cmds:
      - curl -s http://127.0.0.1:{{.HONCHO_PORT}}/health

  shell-db:
    desc: Open a psql shell inside the database container
    cmds:
      - docker exec -it honcho-db psql -U {{.POSTGRES_USER}} -d {{.POSTGRES_DB}}

  reset:
    desc: "Destroy containers, volumes, and db_data/ — destructive!"
    prompt: This will destroy all data. Are you sure?
    cmds:
      - docker compose down -v
      - cmd: powershell -Command "Remove-Item -Recurse -Force ./db_data -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf ./db_data
        platforms: [linux, darwin]
